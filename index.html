<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- URLs are real paths (/community/12), not #hashes. GitHub Pages answers
         those with 404.html (a copy of this file), so relative hrefs would
         resolve against the wrong directory unless <base> is fixed up here,
         before the first stylesheet parses. Must stay above every link,
         script and image in the head -- see js/core/router.ts, which reads
         the result back out of baseURI. -->
    <base href="/" target="_blank">
    <script>
        (function () {
            // Core's routes; a site built on Core lists its own as well
            var ROUTES = ['collection', 'editor', 'ability-editor', 'battle', 'settings'];
            var parts = window.location.pathname.split('/');
            var cut = -1;
            for (var i = 0; i < parts.length; i++) {
                if (ROUTES.indexOf(parts[i]) !== -1) { cut = i; break; }
            }
            // no route segment: either the app root or a path nothing owns (the
            // 404 page). Taking the parent directory breaks for a deep unknown
            // path (/a/b would load views/ from /a/), so outside file:// the
            // install dir is inferred from the host: a GitHub Pages project
            // site lives under its first segment, everything else at the root
            var dir;
            if (cut > 0) dir = parts.slice(0, cut);
            else if (window.location.protocol === 'file:') dir = parts.slice(0, -1);
            else if (/\.github\.io$/.test(window.location.hostname) && parts.length > 2) dir = parts.slice(0, 2);
            else dir = [''];
            document.querySelector('base').setAttribute('href', dir.join('/') + '/');
            // the app root is the front page: flagged here so the body can wear it from the first frame (below).
            // Only when the build switches the landing page on (VITE_LANDING_PAGE=1, see js/core/flags.ts);
            // unset, Vite leaves the placeholder as it is and this never matches.
            if ('%VITE_LANDING_PAGE%' === '1' && cut === -1 && window.location.pathname.replace(/\/+$/, '') === dir.join('/')) document.documentElement.setAttribute('data-boot', 'landing');
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Woogidex</title>
    <meta name="description" content="Woogidex is a fan-made Fakemon creator: design custom Pokemon, build a dex of your own, and battle them out in a 3D simulator.">
    <!-- must run synchronously before style.css paints, so dark mode applies
         on the first frame instead of flashing light then switching -->
    <script>
        (function () {
            try {
                if (localStorage.getItem('woogidex-dark-mode') === 'true') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
                if (localStorage.getItem('woogidex-reduce-motion') === 'true') {
                    document.documentElement.classList.add('reduce-motion');
                }
            } catch (e) {}
            // low-end device: little memory, few cores, or Data Saver on.
            // js/core/device.ts reads this class back; css/perf.css acts on it
            try {
                var nav = navigator, mem = nav.deviceMemory, cores = nav.hardwareConcurrency;
                if ((mem && mem <= 2) || (cores && cores <= 2) || (mem && mem <= 4 && cores && cores <= 4) || (nav.connection && nav.connection.saveData)) {
                    document.documentElement.classList.add('low-end');
                }
            } catch (e) {}
        })();
    </script>
    <!-- the font stylesheet is third-party: loaded without blocking the first
         paint (text shows in the fallback font, then swaps), so a slow
         connection to Google can't hold the whole page blank -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800&family=Inconsolata:wght@400;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800&family=Inconsolata:wght@400;600;700;800&display=swap" rel="stylesheet"></noscript>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <!-- pages are welcome in search results; the artwork is hand-drawn and
         stays out of image search and AI training -->
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:none, noimageindex, noai, noimageai">
    <!-- stylesheets, in cascade order -- THE ORDER IS LOAD-BEARING: later
         files restyle classes from earlier ones, and responsive.css sits
         after the desktop rules it overrides. Adding a file is fine;
         reordering these lines changes what the site looks like. -->
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/notifications.css">
    <link rel="stylesheet" href="css/controls.css">
    <link rel="stylesheet" href="css/pokedex-board.css">
    <link rel="stylesheet" href="css/collection-cards.css">
    <link rel="stylesheet" href="css/modals.css">
    <link rel="stylesheet" href="css/editor.css">
    <link rel="stylesheet" href="css/learnset.css">
    <link rel="stylesheet" href="css/sample-sets.css">
    <link rel="stylesheet" href="css/editor-stats.css">
    <link rel="stylesheet" href="css/abilities.css">
    <link rel="stylesheet" href="css/editor-tools.css">
    <link rel="stylesheet" href="css/library.css">
    <link rel="stylesheet" href="css/cloud-backup.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/settings.css">
    <link rel="stylesheet" href="css/templates.css">
    <link rel="stylesheet" href="css/evolution.css">
    <link rel="stylesheet" href="css/analysis.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/community.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/regions.css">
    <link rel="stylesheet" href="css/staff.css">
    <link rel="stylesheet" href="css/profile.css">
    <link rel="stylesheet" href="css/feed.css">
    <link rel="stylesheet" href="css/messages.css">
    <link rel="stylesheet" href="css/emoji.css">
    <link rel="stylesheet" href="css/events.css">
    <link rel="stylesheet" href="css/skeleton.css">
    <link rel="stylesheet" href="css/name-generator.css">
    <link rel="stylesheet" href="css/ability-blocks.css">
    <link rel="stylesheet" href="css/preview-evolution.css">
    <link rel="stylesheet" href="css/updates.css">
    <link rel="stylesheet" href="css/battle.css">
    <link rel="stylesheet" href="css/legal.css">
    <link rel="stylesheet" href="css/not-found.css">
    <link rel="stylesheet" href="css/landing.css">
    <link rel="stylesheet" href="css/onboarding.css">
    <link rel="stylesheet" href="css/protect.css">
    <!-- phone and touch overrides; last so they win -->
    <link rel="stylesheet" href="css/feedback.css">
    <link rel="stylesheet" href="css/mobile.css">
    <!-- toned-down effects for low-end devices (.low-end); last of all -->
    <link rel="stylesheet" href="css/perf.css">
</head>
<body>
    <!-- the front page's look (white page, the header's logo and line stepped
         aside) from the very first frame, instead of the app's grey shell until
         the scripts open it; activateTopLevelView takes over from there -->
    <script>
        if (document.documentElement.getAttribute('data-boot') === 'landing') {
            document.body.setAttribute('data-page', 'landing-view');
            document.body.classList.add('lp-at-top');
        }
    </script>
    <div class="app-container">
        <!-- logo, the sections and the account menu: js/app/shell/Header.tsx -->
        <header class="header" id="app-header"></header>

        <!-- My Collection's regions: js/app/shell/Sidebar.tsx -->
        <aside class="app-sidebar" id="app-sidebar" aria-label="Regions"></aside>

        <!-- a host's pages get their containers here too (js/core/extend.ts) -->
        <div id="main-content">

            <!-- battle view -->
            <div id="battle-view" style="display:none;"></div>

            <!-- ability battle-effect block editor view -->
            <div id="ability-block-editor-view" style="display:none;"></div>

            <!-- editor view -->
            <div id="editor-view" style="display: none;"></div>

            <!-- collection view (hidden by default so deep links like #editor/
                 or #battle never flash it first; boot reveals it explicitly) -->
            <div id="collection-view" style="display:none;"></div>

            <!-- settings, as its own page rather than a modal -->
            <div id="settings-view" style="display:none;"></div>

            <!-- 404: any path no route owns (router NOT_FOUND); js/app/pages/NotFoundPage.tsx -->
            <div id="not-found-view" style="display:none;"></div>

        </div>
    </div>

    <!-- every dialog is rendered by React into #react-dialogs (js/app/dialogs.tsx) -->
    <div class="toast-container" id="toast-container"></div>
    <!-- first-visit tips for each section: js/app/shell/Onboarding.tsx -->
    <div id="onboarding-root"></div>

<script type="module" src="js/core/app.ts"></script>
<!-- boot guard: the module above imports npm packages by name, which only a
     bundler or dev server can resolve. Opening off disk or serving the repo
     with a plain static server leaves a half-painted shell and 404s with no
     explanation, so this shows one. -->
<script>
    (function () {
        setTimeout(function () {
            if (window.__woogidexBooted) return;
            var local = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
            var onDisk = location.protocol === 'file:';
            document.body.innerHTML =
                '<div id="woogidex-boot-error" style="font:16px/1.6 system-ui,sans-serif;max-width:44rem;margin:12vh auto;padding:0 1.5rem;color:#222">'
                + '<h1 style="font-size:1.5rem;margin:0 0 .75rem">Woogidex did not start.</h1>'
                + '<p style="margin:0 0 1rem">The app code never ran, so this page is only the empty shell.</p>'
                + ((onDisk || local)
                    ? '<p style="margin:0 0 1rem">Woogidex has a build step. Opening the files directly, or serving the'
                      + ' folder with a plain static server, cannot work: the code imports packages by name and something'
                      + ' has to resolve them.</p>'
                      + '<pre style="background:#f4f4f5;padding:1rem;border-radius:8px;overflow:auto">npm install\nnpm run dev</pre>'
                      + '<p style="margin:1rem 0 0;color:#666">To check a production build instead: <code>npm run build</code>'
                      + ' then <code>npm run preview</code>.</p>'
                    : '<p style="margin:0 0 1rem">This is usually a bad deploy. Check the browser console for a failed'
                      + ' script request, and that the build output was published.</p>')
                + '</div>';
        }, 6000);
    })();
</script>
</body>
</html>

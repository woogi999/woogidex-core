# The woogidex.xyz site is built on this repo. A change on main asks the
# site's Deploy workflow (in woogi999/woogidex-web, private) to rebuild and
# deploy it. Forks skip this: it only runs in woogi999/woogidex-core.
#
# Needs the DEPLOY_DISPATCH_TOKEN secret: a fine-grained personal access
# token with access to woogi999/woogidex-web only, Contents: Read and write.

name: Deploy the site

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  notify:
    if: github.repository == 'woogi999/woogidex-core'
    runs-on: ubuntu-latest
    steps:
      - name: Ask woogidex-web to deploy
        env:
          TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::DEPLOY_DISPATCH_TOKEN is not set, so the site was not deployed."
            exit 1
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/woogi999/woogidex-web/dispatches \
            -d '{"event_type":"core-updated","client_payload":{"sha":"${{ github.sha }}"}}'
